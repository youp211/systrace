[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
systrace-core = { path = "crates/core" }
systrace-modules = { path = "crates/modules" }
systrace-tui = { path = "crates/tui" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false }
libc = "0.2"
ratatui = "0.29"
